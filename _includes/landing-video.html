<!-- ================= WATCH (explainer video) =================
     Rendered from the HyperFrames project in video/sirixdb-explainer/ (see its README to edit,
     re-render and publish a new cut). The MP4 is the caption-free picture; captions come from the
     WebVTT track so they can be switched off and are readable by assistive technology.
     preload="none": nothing but the poster loads until the visitor presses play. -->
<section class="band band--alt video-sec" id="watch" aria-labelledby="watch-h">
  <div class="lp-container">
    <div class="sec-head reveal">
      <div class="kicker">Watch</div>
      <h2 class="h2" id="watch-h">SirixDB in 95 seconds.</h2>
      <p class="sub">Every revision kept and queryable, field-level identity and diffs, both kinds of time and versioned indexes &mdash; with real <code>sirix-shell</code> output. Captions are available from the player's CC control.</p>
    </div>
    <figure class="explainer reveal">
      <video class="explainer__video" controls preload="none" playsinline width="1920" height="1080"
             poster="/assets/video/sirixdb-explainer-poster.jpg" aria-describedby="watch-cap">
        <source src="/assets/video/sirixdb-explainer.mp4" type="video/mp4">
        <track kind="captions" src="/assets/video/sirixdb-explainer.en.vtt" srclang="en" label="English">
        <p>Your browser cannot play this video. <a href="/assets/video/sirixdb-explainer.mp4">Download the MP4</a>.</p>
      </video>
      <figcaption class="explainer__cap" id="watch-cap">A 95-second tour; nothing plays until you press play. <a href="/assets/video/sirixdb-explainer.mp4" download>Download the MP4</a> or the <a href="/assets/video/sirixdb-explainer.en.vtt">captions</a>.</figcaption>
    </figure>
  </div>
</section>
