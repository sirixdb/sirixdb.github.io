<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
  {%- assign page_description = page.description | default: site.description | strip_newlines | strip -%}
  <meta name="description" content="{{ page_description | escape }}">
  <meta name="keywords" content="Database, Temporal, Evolutionary, JSON, XML, Versioning, Time Travel">
  <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico">
  <link rel="canonical" href="https://sirix.io{{ page.url | replace:'index.html','' | prepend: site.baseurl }}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="SirixDB">
  <meta property="og:title" content="{% if page.title %}{{ page.title | escape }}{% else %}{{ site.title | escape }}{% endif %}">
  <meta property="og:description" content="{{ page_description | escape }}">
  <meta property="og:url" content="https://sirix.io{{ page.url | replace:'index.html','' }}">
  <meta property="og:image" content="https://sirix.io/images/og-sirix.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@{{ site.twitter_username }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css?v=4">
  {%- if page.layout == 'landing-page' %}
  <link rel="stylesheet" href="/css/landing.css?v=1">
  {%- endif %}
  {%- if page.url == '/contact.html' %}
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
  {%- endif %}
</head>
