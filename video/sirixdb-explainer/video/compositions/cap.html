  <div data-hf-id="hf-ajwd" id="root" data-composition-id="cap" data-width="1920" data-height="1080">
    <div data-hf-id="hf-4v5x" id="cap-band">
      <div data-hf-id="hf-re3o" class="cg" id="cap-g0"><span data-hf-id="hf-asgr">You update a record.</span></div>
      <div data-hf-id="hf-s5rh" class="cg" id="cap-g1"><span data-hf-id="hf-86u7">The old value is gone.</span></div>
      <div data-hf-id="hf-w3vi" class="cg" id="cap-g2"><span data-hf-id="hf-xh37">SirixDB keeps every version.</span></div>
      <div data-hf-id="hf-01zj" class="cg" id="cap-g3"><span data-hf-id="hf-hnbu">Each commit writes only what changed</span></div>
      <div data-hf-id="hf-403k" class="cg" id="cap-g4"><span data-hf-id="hf-w5sg">and shares the rest,</span></div>
      <div data-hf-id="hf-6zd5" class="cg" id="cap-g5"><span data-hf-id="hf-12ux">so storage grows with the change,</span></div>
      <div data-hf-id="hf-axh6" class="cg" id="cap-g6"><span data-hf-id="hf-mw09">not the history.</span></div>
      <div data-hf-id="hf-evl7" class="cg" id="cap-g7"><span data-hf-id="hf-aiat">Any revision opens directly:</span></div>
      <div data-hf-id="hf-itp8" class="cg" id="cap-g8"><span data-hf-id="hf-w23k">by number,</span></div>
      <div data-hf-id="hf-jntf" class="cg" id="cap-g29"><span data-hf-id="hf-rhh0">by timestamp,</span></div>
      <div data-hf-id="hf-c55x" class="cg" id="cap-g30"><span data-hf-id="hf-stqu">or bitemporally.</span></div>
      <div data-hf-id="hf-jld1" class="cg" id="cap-g9"><span data-hf-id="hf-1mlk">Nothing to replay:</span></div>
      <div data-hf-id="hf-4h0v" class="cg" id="cap-g10"><span data-hf-id="hf-jt14">revision one reads like the latest.</span></div>
      <div data-hf-id="hf-ybb2" class="cg" id="cap-g11"><span data-hf-id="hf-cgp5">Every field keeps its identity across revisions.</span></div>
      <div data-hf-id="hf-ud71" class="cg" id="cap-g12"><span data-hf-id="hf-tkef">Follow one value through time,</span></div>
      <div data-hf-id="hf-tlj8" class="cg" id="cap-g13"><span data-hf-id="hf-nt0h">or diff any two revisions:</span></div>
      <div data-hf-id="hf-h30r" class="cg" id="cap-g14"><span data-hf-id="hf-86gx">exact inserts, updates and deletes.</span></div>
      <div data-hf-id="hf-d4wq" class="cg" id="cap-g15"><span data-hf-id="hf-z9qm">And it&#x27;s bitemporal:</span></div>
      <div data-hf-id="hf-96sp" class="cg" id="cap-g16"><span data-hf-id="hf-uv0s">SirixDB knows when a fact was recorded</span></div>
      <div data-hf-id="hf-8f4w" class="cg" id="cap-g17"><span data-hf-id="hf-bl8i">and when it was true,</span></div>
      <div data-hf-id="hf-vwmf" class="cg" id="cap-g18"><span data-hf-id="hf-wy7r">so a correction never erases what you knew.</span></div>
      <div data-hf-id="hf-ryie" class="cg" id="cap-g19"><span data-hf-id="hf-1f4g">Its indexes are versioned too,</span></div>
      <div data-hf-id="hf-oa3u" class="cg" id="cap-g20"><span data-hf-id="hf-7qo4">including columnar projections</span></div>
      <div data-hf-id="hf-bdi4" class="cg" id="cap-g31"><span data-hf-id="hf-o84c">for fast analytics on any revision.</span></div>
      <div data-hf-id="hf-s87v" class="cg" id="cap-g21"><span data-hf-id="hf-a1dj">Embed it as a Java library,</span></div>
      <div data-hf-id="hf-hcq8" class="cg" id="cap-g22"><span data-hf-id="hf-qecg">run the REST server,</span></div>
      <div data-hf-id="hf-i4e1" class="cg" id="cap-g23"><span data-hf-id="hf-yohn">use the shell,</span></div>
      <div data-hf-id="hf-9gi6" class="cg" id="cap-g24"><span data-hf-id="hf-deyv">or let AI agents edit safely over MCP.</span></div>
      <div data-hf-id="hf-dem7" class="cg" id="cap-g25"><span data-hf-id="hf-z8mo">SirixDB.</span></div>
      <div data-hf-id="hf-4qqc" class="cg" id="cap-g26"><span data-hf-id="hf-vqkw">Every version of your data,</span></div>
      <div data-hf-id="hf-5ie5" class="cg" id="cap-g27"><span data-hf-id="hf-8f3k">kept and queryable as fast as the present.</span></div>
      <div data-hf-id="hf-fppe" class="cg" id="cap-g28"><span data-hf-id="hf-q8w6">Append-only, bitemporal,</span></div>
      <div data-hf-id="hf-k1dz" class="cg" id="cap-g32"><span data-hf-id="hf-kh8k">embeddable, and open source.</span></div>
