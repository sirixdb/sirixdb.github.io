# Site settings
title: Sirix
email: johannes.lichtenberger@sirix.io
description: >-
    SirixDB is an evolutionary, bitemporal NoSQL document store for JSON and XML.
    Keep the full history of your data with minimal storage overhead.
baseurl: "" # the subpath of your site, e.g. /blog/
url: "https://sirix.io" # the base hostname & protocol for your site
twitter_username: sirixdb
github_username:  sirixdb

# Build settings
markdown: kramdown

kramdown:
  parse_block_html: true

highlighter: rouge

plugins:
  - jekyll-gzip

exclude:
  - vendor
  - Gemfile.lock
  - Gemfile
  - README.md
  - scripts
  - tests
  - __pycache__
  - video   # editable source of the explainer video (see video/sirixdb-explainer/README.md)
